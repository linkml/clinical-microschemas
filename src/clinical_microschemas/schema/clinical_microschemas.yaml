  HumanPredictedFvcRecord:
    is_a: ClinicalMeasurementRecord
    description: >-
      Predicted total amount of air a person can forcibly exhale after taking the deepest
      breath possible. Predictions are based on a reference equation.
    slot_usage:
      measurement_value:
        range: HumanPredictedFvcQuantity
    rules:
      - preconditions:
          slot_conditions:
            measurement_type:
              any_of:
                - equals_string: OMOP:4150403
        postconditions:
          slot_conditions:
            unit:
              any_of:
                - equals_string: L
            data_type:
              equals_string: decimal
            instrument:
              any_of:
