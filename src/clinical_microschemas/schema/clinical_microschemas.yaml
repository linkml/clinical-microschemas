  #────────────────────────────────────────────────────────────────
  # Body Mass Index (BMI) Microschemas
  #────────────────────────────────────────────────────────────────
  # Aligned CDEs from cde-harmonization:
  #   - LOINC:39156-5 "BMI" (PhenX/LOINC)
  #   - caDSR:2006410 v3 "Person Body Mass Index Value" (NCI/NIDA)
  #   - NINDS:C11131 v3 "Body mass index value" (NINDS)
  #   - NHLBI ISTH:18:43:27:613 "Body Mass Index (BMI)"
  #   - PhenX PX570101 "BMI Kilogram Per Squaremeter" / "Pound Per Squareinch"
  #────────────────────────────────────────────────────────────────

  BodyMassIndexRecord:
    is_a: ClinicalMeasurementRecord
    description: >-
      A calculated numerical quantity representing an individual's weight-to-height
      ratio. BMI is calculated as weight (kg) divided by height (m) squared. 
    slot_usage:
      measurement_value:
        range: BodyMassIndexQuantity
    rules:
      - preconditions:
          slot_conditions:
            measurement_type:
              any_of:
                - equals_string: OBA:0002045455
                - equals_string: OMOP:3038553
                - equals_string: LOINC:39156-5
        postconditions:
          slot_conditions:
            unit:
              any_of:
                - equals_string: kg/m2
            method:
              any_of:
                - equals_string: calculated
            data_type:
              equals_string: decimal
            calculated_from:
              any_of:
                - equals_expression: "{HumanBodyWeightRecord001} / ({HumanBodyHeightRecord001} / 100)^2"
                - equals_expression: "{HumanBodyWeightRecord001} / ({HumanBodyHeightRecord003} / 100)^2"
                - equals_expression: "{HumanBodyWeightRecord003} / ({HumanBodyHeightRecord001} / 100)^2"
                - equals_expression: "{HumanBodyWeightRecord004} / ({HumanBodyHeightRecord001} / 100)^2" 
                - equals_expression: "{HumanBodyWeightRecord003} / ({HumanBodyHeightRecord003} / 100)^2"
                - equals_expression: "{HumanBodyWeightRecord004} / ({HumanBodyHeightRecord003} / 100)^2"           
                - equals_expression: "({HumanBodyWeightRecord002} / 2.2) / ({HumanBodyHeightRecord002} / 39.37)^2"              

