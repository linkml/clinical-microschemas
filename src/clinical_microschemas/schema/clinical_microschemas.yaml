  HumanPercentPredictedFvcRecord:
    is_a: ClinicalMeasurementRecord
    description: >-
      Percent of the predicted FVC that is achieved by the patient
    slot_usage:
      measurement_value:
        range: HumanPercentPredictedFvcQuantity
    rules:
      - preconditions:
          slot_conditions:
            measurement_type:
              any_of:
                - equals_string: OMOP:4253179
        postconditions:
          slot_conditions:
