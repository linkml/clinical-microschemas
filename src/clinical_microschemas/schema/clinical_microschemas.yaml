                - equals_string: mL
            instrument:
              any_of:
                - equals_string: spirometer
                - equals_string: vitalograph
                - equals_string: body_plesmograph
            data_type:
              equals_string: decimal
            context:
              any_of:
                - equals_string: before_bronchodilator
                - equals_string: after_bronchodilator
            method:
              any_of:
                - equals_string: spirometry
                - equals_string: body_plesmography

  HumanMeasuredFvcRecord001:
    is_a: HumanMeasuredFvcRecord
    description: >-
      Total amount of air a person can forcibly exhale after taking the deepest breath
      possible
    slot_usage:
      measurement_value:
        range: HumanMeasuredFvcQuantity001
    rules:
      - preconditions:
          slot_conditions:
            instrument:
              any_of:
                - equals_string: spirometer
            unit:
              any_of:
                - equals_string: L
        postconditions:
          slot_conditions:
            body_position:
              any_of:
