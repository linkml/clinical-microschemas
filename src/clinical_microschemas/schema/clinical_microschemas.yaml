  DataTypeEnum:
    description: The data type of an observation value
    permissible_values:
      decimal:
        description: Decimal number
      integer:
        description: Integer number
      enum:
        description: Enumerated value
      boolean:
        description: Boolean value
      string:
        description: String value
      numeric:
        description: decimal or integer - from dbGAP data types
      code:
        description: >-
          data are a list of acceptable values or a controlled vocabulary,
          from dbGAP data types, same as enum
      uriorcurie:
        description: A URI or CURIE value
      identifier:
        description: a string used as an identifier by an external data source

  MethodEnum:
    description: The method used for a measurement or observation
    permissible_values:
      anthropometry:
        description: >-
          physical measurement of the human body, including height, weight, and other
          body dimensions
      survey:
        description: >-
          list of questions given to a participant for data collection purposes - the
          survey is filled out by the participant independently
      interview:
        description: >-
          series of questions posed to a participant by an interviewer for data
          collection purposes
      calculated:
        description: >-
          clinical record that results from a calculation rather than being directly
          measured
      spirometry:
        description: >-
          breathing test used to assess lung function
      body_plesmography:
        description: >-
          precise pulmonary function test where the patient sits in a sealed chamber and
          breathes into a specialized mouthpiece. This method uses Boyle's Law  and is
          considered a "gold standard"
      gli:
        description: >-
          a standard reference range and calculator for spirometry and lung function
          tests published by the Global Lung Function Initiative in 2012
      gli_global:
        description: >-
          a standard reference range and calculator for spirometry and lung function
          tests published by the Global Lung Function Initiative in 2022. This is an
          update of the 2012 standard that is more ethnically diverse
      nhanesiii:
        description: >-
          standard reference equations for spirometry published in 2005
      jaffe_reaction:
        description: >-
          colorimetric method for measuring creatinine based on the Jaffe reaction,
          in which creatinine reacts with picric acid in alkaline solution
      cbc:
        description: >-
          complete blood count; a common blood test that measures the cellular
          components of blood including red cells, white cells, and platelets
      plac_test:
        description: >-
          Lipoprotein-Associated Phospholipase A2 (Lp-PLA2) test; a blood test
          used to assess cardiovascular and stroke risk
      enzymatic_creatinine_assay:
        description: >-
          enzymatic method for measuring creatinine using creatininase, offering
          greater specificity than the Jaffe reaction with fewer interferences
      lc_ms_ms:
        description: >-
          liquid chromatography-tandem mass spectrometry; a reference method for
          quantifying analytes with high specificity and sensitivity
      immunoturbidometry:
        description: >-
          photometric method measuring the turbidity caused by antigen-antibody
          complexes in suspension
      immunonephelometry:
        description: >-
          optical method measuring light scatter from antigen-antibody complexes
          to quantify proteins such as albumin
      chemiluminescence_immunoassay:
        description: >-
          immunoassay that uses a chemiluminescent label to detect and quantify
          an analyte via light emission
      elisa:
        description: >-
          enzyme-linked immunosorbent assay; a plate-based immunoassay for
          detecting and quantifying proteins or antibodies
      albumin_dipstick:
        description: >-
          semi-quantitative colorimetric urine test strip method for detecting
          albumin
      hplc:
        description: >-
          high-performance liquid chromatography; a chromatographic technique
          used to separate, identify, and quantify analytes in a mixture

      polysomnography:
        description: >-
          in-laboratory polysomnography; comprehensive multi-channel sleep study
          recording brain activity, eye movements, muscle activity, and cardiorespiratory signals
      home_sleep_apnea_test:
        description: >-
          portable, simplified sleep monitoring performed at home to detect obstructive sleep apnea
      bcg_bcp_colorimetric:
        description: >-
          bromocresol green (BCG) or bromocresol purple (BCP) dye-binding colorimetric assay
          for measuring albumin concentration
      questionnaire:
        description: >-
          self-report questionnaire or structured interview instrument used to collect
          behavioral, dietary, or symptom data
      enzymatic_kinetic_assay:
        description: >-
          enzymatic kinetic (rate) assay standardized by the IFCC; measures the rate of
          an enzymatic reaction to quantify substrate or enzyme concentration
      diazo_colorimetric:
        description: >-
          diazo (van den Bergh) colorimetric method for measuring bilirubin fractions
          in serum or plasma
      urease_gldh:
        description: >-
          enzymatic urease/glutamate dehydrogenase (GLDH) coupled assay for measuring
          blood urea nitrogen (BUN) or urea
      ion_selective_electrode:
        description: >-
          potentiometric method using ion-selective electrodes to measure electrolyte
          concentrations such as sodium, potassium, and chloride
      agatston_scoring:
        description: >-
          Agatston scoring algorithm applied to non-contrast cardiac CT images to
          quantify coronary artery calcium
      volume_scoring:
        description: >-
          volume-based calcium scoring from non-contrast cardiac CT; reports total
          calcium volume in mm³
      carotid_ultrasound:
        description: >-
          B-mode (2-D) carotid ultrasound imaging used to measure intima-media thickness
          and detect plaques
      duplex_ultrasound:
        description: >-
          duplex ultrasound combining B-mode imaging with Doppler velocity measurements
          to grade arterial stenosis
      ct_angiography:
        description: >-
          computed tomography angiography; contrast-enhanced CT imaging of blood vessels
      automated_hematology:
        description: >-
          automated hematology analysis using impedance, electrical resistance, or
          light-scatter technologies to count and characterize blood cells
      manual_differential:
        description: >-
          manual microscopic differential cell count performed by a trained laboratory
          technician or pathologist on a stained blood smear
      one_stage_clotting:
        description: >-
          one-stage clotting assay (PT-based for Factor VII or aPTT-based for Factor VIII)
          measuring coagulation factor activity
      chromogenic_assay:
        description: >-
          chromogenic substrate assay measuring coagulation factor activity via
          colorimetric detection of a chromogenic substrate cleavage product
      hexokinase_glucose_oxidase:
        description: >-
          enzymatic assay using hexokinase or glucose oxidase to measure glucose
          concentration; the reference method for glucose measurement
      clauss_assay:
        description: >-
          Clauss functional clotting assay for fibrinogen; measures the time to clot
          formation after adding thrombin to diluted plasma
      electrocardiography:
        description: >-
          electrocardiography; recording of the heart's electrical activity over time
          to measure intervals and waveforms
      pulse_oximetry:
        description: >-
          non-invasive photoplethysmographic method for measuring blood oxygen saturation
          and pulse rate
      auscultatory:
        description: >-
          auscultatory method for blood pressure measurement using a stethoscope and
          sphygmomanometer (Korotkoff sounds)
      oscillometric:
        description: >-
          oscillometric method for blood pressure measurement detecting arterial wall
          oscillations via an automated cuff
      actigraphy:
        description: >-
          actigraphy; continuous monitoring of movement and rest-activity cycles using
          a wrist-worn accelerometer to estimate sleep duration and quality
      thermometry:
        description: >-
          thermometry; measurement of body temperature using a thermometer placed at
          an oral, rectal, tympanic, temporal, or axillary site
      multiplex_bead_immunoassay:
        description: >-
          multiplex bead-based immunoassay (e.g., Luminex xMAP) simultaneously
          quantifying multiple cytokines or proteins in a single sample
      microhematocrit_centrifugation:
        description: >-
          microhematocrit centrifugation method; capillary blood tubes are centrifuged
          and the packed cell volume fraction read directly
      cyanmethemoglobin:
        description: >-
          cyanmethemoglobin (Drabkin) spectrophotometric method for measuring whole-blood
          hemoglobin concentration
      precipitation_method:
        description: >-
          precipitation method for HDL cholesterol; LDL and VLDL are precipitated with
          a chemical agent and HDL is measured in the supernatant
      direct_homogeneous_enzymatic:
        description: >-
          direct homogeneous enzymatic assay for HDL or LDL cholesterol; uses selective
          detergents and enzymatic reactions without prior precipitation
      friedewald_calculation:
        description: >-
          Friedewald equation calculation of LDL cholesterol from total cholesterol,
          HDL cholesterol, and triglycerides
      manual_pulse_palpation:
        description: >-
          manual palpation or auscultation of the pulse at a peripheral artery or
          cardiac apex to count heart rate
      latex_agglutination:
        description: >-
          latex particle agglutination immunoassay for detecting and semi-quantifying
          analytes such as D-dimer
      ristocetin_cofactor_assay:
        description: >-
          ristocetin cofactor activity assay (VWF:RCo) measuring the ability of von
          Willebrand factor to agglutinate platelets in the presence of ristocetin
      boronate_affinity_chromatography:
        description: >-
          boronate affinity chromatography for HbA1c measurement; glycated hemoglobin
          binds selectively to boronate-coupled resin
      direct_measurement:
        description: >-
          direct physical measurement using a measuring tape, ruler, or caliper applied
          to the body surface
      gc_ms:
        description: >-
          gas chromatography-mass spectrometry; a combined technique for separating
          and identifying volatile compounds with high specificity
      arterial_catheter:
        description: >-
          invasive intra-arterial catheter measurement using a pressure transducer
          placed directly in an artery to continuously measure blood pressure
      clearance_test:
        description: >-
          renal clearance test measuring the rate at which the kidneys filter a marker
          substance (e.g., iothalamate, inulin) from plasma
  InstrumentEnum:
    description: The instrument used for a measurement
    permissible_values:
      wall_mounted_stadiometer:
        description: >-
          fixed, high-precision medical device used to measure human height, consisting
          of a vertical measuring rod or tape fastened to a wall with a sliding headpiece
        meaning: MMO:0000105
      flexible_measuring_tape:
        description: >-
          flexible tape used to measure height or body circumference
      portable_stadiometer:
        description: >-
          portable device used to measure height, typically used in field settings
      anthropometer_rod:
        description: >-
          rigid rod-based instrument used to measure body dimensions including height
      sonar_stadiometer:
        description: >-
          ultrasound-based device used to measure height without contact
      mechanical_beam_balance_scale:
        description: >-
          medical device used to measure human weight
        meaning: MMO:0000087
      digital_scale:
        description: >-
          electronic device used to measure human weight using strain gauge sensors
        meaning: MMO:0000087
      spring_scale:
        description: >-
          mechanical device that measures weight by the displacement of a spring
      spirometer:
        description: >-
          medical device that measures lung function by recording the amount and speed
          of air a person can inhale and exhale
      vitalograph:
        description: >-
          a portable medical device that measures lung function by recording the amount
          and speed of air a person can inhale and exhale
      body_plesmograph:
        description: >-
          sealed, clear chamber with a mouthpiece for a person to breath through
      peak_flow_meter:
        description: >-
          portable, handheld device used to measure how fast and hard a person can
          exhale
      flow_cytometer:
        description: >-
          instrument that measures physical and chemical characteristics of cells
          or particles as they flow through a laser beam
      microscope:
        description: >-
          optical instrument used to magnify and visualize cells, microorganisms,
          or other small structures
      particle_counter:
        description: >-
          instrument that counts and sizes particles suspended in a fluid, used
          in hematology analyzers
      mechanical_baby_scale:
        description: >-
          mechanical scale designed to weigh infants and young children
      unknown:
        description: >-
          the instrument used for the measurement is not known or was not
          recorded

      polysomnograph:
        description: >-
          multi-channel laboratory instrument for polysomnography recording EEG, EOG,
          EMG, ECG, airflow, respiratory effort, and oxygen saturation
      portable_home_sleep_apnea_monitor:
        description: >-
          portable simplified device used for home sleep apnea testing, recording
          airflow, respiratory effort, and oximetry
      automated_clinical_chemistry_analyzer:
        description: >-
          automated benchtop or modular analyzer performing photometric, potentiometric,
          and immunological assays on serum, plasma, or urine
      microplate_reader:
        description: >-
          spectrophotometric instrument that reads absorbance, fluorescence, or
          luminescence in microwell plates for immunoassays such as ELISA
      automated_immunoassay_analyzer:
        description: >-
          dedicated automated platform for chemiluminescent, fluorescent, or
          electrochemiluminescent immunoassays
      automated_hematology_analyzer:
        description: >-
          automated instrument using impedance, light scatter, or flow cytometry to
          count and characterize blood cell populations in a complete blood count
      automated_coagulation_analyzer:
        description: >-
          automated instrument measuring clot formation times and coagulation factor
          activities via optical or mechanical detection
      carotid_ultrasound_system:
        description: >-
          duplex ultrasound system with a high-frequency linear transducer for B-mode
          carotid artery imaging and Doppler flow measurement
      ct_scanner:
        description: >-
          computed tomography scanner; cardiac-gated CT used for coronary artery calcium
          scoring and CT angiography
      electrocardiograph:
        description: >-
          electrocardiograph (ECG/EKG machine) recording the heart's electrical activity
          via surface electrodes for interval and waveform measurements
      pulse_oximeter:
        description: >-
          non-invasive photoplethysmographic device placed on a finger or earlobe to
          measure arterial oxygen saturation (SpO2) and pulse rate
      sphygmomanometer:
        description: >-
          manual aneroid or mercury sphygmomanometer with an inflatable cuff and
          stethoscope for auscultatory blood pressure measurement
      automated_bp_monitor:
        description: >-
          automated oscillometric blood pressure monitor measuring systolic and diastolic
          pressure with an inflatable upper-arm or wrist cuff
      glucometer:
        description: >-
          point-of-care electrochemical glucometer for rapid whole-blood glucose
          measurement using a glucose oxidase or glucose dehydrogenase test strip
      actigraph:
        description: >-
          wrist-worn or hip-worn accelerometer device recording continuous movement
          data to estimate sleep and physical activity patterns
      thermometer:
        description: >-
          digital electronic thermometer for oral, rectal, or axillary body temperature
          measurement
      infrared_thermometer:
        description: >-
          non-contact infrared or tympanic thermometer measuring body temperature
          from emitted thermal radiation at the ear canal or skin surface
      multiplex_analyzer:
        description: >-
          bead-based multiplex immunoassay platform (e.g., Luminex xMAP) capable of
          simultaneously quantifying multiple analytes in a single sample
      blood_gas_analyzer:
        description: >-
          point-of-care or laboratory instrument measuring pH, blood gases (pO2, pCO2),
          electrolytes, and metabolites in whole blood
      hemocytometer:
        description: >-
          ruled counting chamber used with a light microscope for manual cell counting
          of blood or other cell suspensions
      hematocrit_centrifuge:
        description: >-
          microhematocrit centrifuge spinning capillary blood tubes at high speed to
          pack red blood cells for packed cell volume (hematocrit) measurement
      point_of_care_cardiac_analyzer:
        description: >-
          bedside or point-of-care immunoassay device for rapid quantitative measurement
          of cardiac biomarkers such as BNP, NT-proBNP, or troponin
      hba1c_analyzer:
        description: >-
          dedicated ion-exchange HPLC or immunoassay analyzer for HbA1c measurement,
          reporting the percentage of glycated hemoglobin
      lactate_meter:
        description: >-
          handheld electrochemical point-of-care device for rapid whole-blood or plasma
          lactate measurement
      stethoscope:
        description: >-
          acoustic medical device used for auscultation of heart sounds and Korotkoff
          sounds during manual blood pressure measurement
      infantometer:
        description: >-
          flat-surface board with a fixed headpiece and sliding footpiece used to
          measure recumbent length in infants
      bariatric_scale:
        description: >-
          heavy-duty scale with an extended weight capacity designed to measure body
          weight in bariatric patients
      body_composition_analyzer:
        description: >-
          device using bioelectrical impedance analysis (BIA) or dual-energy X-ray
          absorptiometry (DXA) to measure body weight and body composition
      digital_baby_scale:
        description: >-
          digital electronic scale designed to accurately measure the weight of infants
          and young children
      gli:
        description: >-
          Global Lung Function Initiative 2012 reference equations for spirometry;
          used to derive predicted lung function values
      gli_global:
        description: >-
          Global Lung Function Initiative 2022 multi-ethnic global reference equations
          for spirometry; an update of the 2012 GLI equations
      nhanesiii:
        description: >-
          NHANES III (1999) reference equations for spirometry derived from the Third
          National Health and Nutrition Examination Survey
