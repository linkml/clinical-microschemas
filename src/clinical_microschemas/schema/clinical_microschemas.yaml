classes:

  #────────────────────────────────────────────────────────────────
  # RECORD MICROSCHEMAS: Domain-specific composable data elements
  #────────────────────────────────────────────────────────────────

  ClinicalMeasurementRecord:
    instantiates:
      - MicroschemaDefinition
    description: >-
      A data structure with key and value attributes that represents a single observation.
      This can include results of clinical labs, scores and indices, socioeconomic, or
      behavioral observations.
    class_uri: bdchm:Observation
    annotations:
      domain_of_use: clinical
    slots:
      - subject_identifier
      - measurement_type
      - measurement_value
      - unit
      - method
      - instrument
      - reagent_kit
      - calculated_from
      - body_location
      - body_position
      - context
      - collected_by
      - data_type
      - age_at_measurement
      - study_site
      - absolute_time
    slot_usage:
      subject_identifier:
        required: true
      measurement_type:
        required: true
      measurement_value:
        required: true
      age_at_measurement:
        required: true

  ConditionStatusRecord:
    instantiates:
      - MicroschemaDefinition
    description: >-
      Record suggesting the presence of a disease or medical condition stated as a 
      diagnosis, sign, or symptom
    class_uri: bdchm:Condition
    annotations:
      domain_of_use: clinical
    slots:
      - subject_identifier
      - condition_type
      - associated_evidence
      - instrument
      - age_at_condition_start
      - age_at_condition_end
      - age_at_condition_record
      - condition_status
      - condition_provenance
      - condition_severity
      - relationship_to_participant
    slot_usage:
      subject_identifier:
        required: true
      condition_type:
        required: true
      condition_status:
        required: true
      relationship_to_participant:
        required: true
      age_at_condition_record:
        required: true

  DrugStatusRecord:
    instantiates:
      - MicroschemaDefinition
    description: >-
      Record suggesting exposure to a medication
    class_uri: bdchm:DrugExposure
    annotations:
      domain_of_use: clinical
    slots:
      - subject_identifier
      - drug_type
      - age_at_drug_start
      - age_at_drug_end
      - age_at_drug_record
      - route_of_administration
      - dose
      - frequency
      - indication
    slot_usage:
      subject_identifier:
        required: true
      drug_type:
        required: true
      age_at_drug_record:
        required: true

  ProcedureStatusRecord:
    instantiates:
      - MicroschemaDefinition
    description: >-
      Record of activity or process ordered by or carried out by a healthcare provider for a diagnostic or therapeutic reason
    class_uri: bdchm:Procedure
    annotations:
      domain_of_use: clinical
    slots:
      - subject_identifier
      - procedure_type
      - collected_by
      - age_at_procedure_start
      - age_at_procedure_end
      - age_at_procedure_record
    slot_usage:
      subject_identifier:
        required: true
      procedure_type:
        required: true
      age_at_procedure_record:
        required: true

