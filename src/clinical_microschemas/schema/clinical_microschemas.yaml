    is_a: ClinicalMeasurementRecord
    description: >-
      Predicted total amount of air a person can forcibly exhale after taking the deepest
      breath possible. Predictions are based on a reference equation.
    slot_usage:
      measurement_value:
        range: HumanPredictedFvcQuantity
    rules:
      - preconditions:
          slot_conditions:
            measurement_type:
              any_of:
                - equals_string: OMOP:4150403
        postconditions:
          slot_conditions:
            unit:
              any_of:
                - equals_string: L
            data_type:
              equals_string: decimal
            instrument:
              any_of:
                - equals_string: gli
                - equals_string: gli_global
                - equals_string: nhanesiii
            method:
              any_of:
                - equals_string: calculated
                #investigate adding the calculation

  HumanPercentPredictedFvcRecord:
    is_a: ClinicalMeasurementRecord
    description: >-
      Percent of the predicted FVC that is achieved by the patient
    slot_usage:
      measurement_value:
        range: HumanPercentPredictedFvcQuantity
    rules:
      - preconditions:
          slot_conditions:
            measurement_type:
              any_of:
                - equals_string: OMOP:4253179
        postconditions:
          slot_conditions:
            unit:
              any_of:
                - equals_string: "%"
            data_type:
              equals_string: decimal
            method:
              equals_string: calculated
            calculated_from:
              any_of:
                - equals_expression: "({HumanFvcRecord001} / {HumanPredictedFvcRecord}) * 100"
                - equals_expression: "(({HumanFvcRecord002} / 1000) / {HumanPredictedFvcRecord}) * 100"
              

