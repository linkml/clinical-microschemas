#----------------------------------------------------------
#Albumin Creatinine Ratio in Urine
#----------------------------------------------------------
  HumanAlbuminCreatinineRatioUrineRecord:
    is_a: ClinicalMeasurementRecord
    description: >-
      Ratio of albumin to creatinine measured in urine
    slot_usage:
      measurement_value:
        range: HumanAlbuminCreatinineRatioUrineQuantity
    rules:
      - preconditions:
          slot_conditions:
            measurement_type:
              any_of:
                - equals_string: OBA:2100053
                - equals_string: OMOP:4154347
        postconditions:
          slot_conditions:
            unit:
              any_of:
                - equals_string: "mg/g{creat}"
            data_type:
              equals_string: decimal
            method:
              any_of:
                - equals_string: calculated
            calculated_from:
              any_of:
                - equals_expression: "{HumanAlbuminUrineRecord001} / ({HumanCreatinineUrineRecord001} / 1000)"
                - equals_expression: "({HumanAlbuminUrineQuantity002} * 10) / ({HumanCreatinineUrineRecord001} / 1000)"
                - equals_expression: "({HumanAlbuminUrineQuantity003} * 10) / ({HumanCreatinineUrineRecord001} / 1000)"
                - equals_expression: "({HumanAlbuminUrineQuantity004} * 10) / ({HumanCreatinineUrineRecord001} / 1000)"
                - equals_expression: "({HumanAlbuminUrineQuantity005} * 10) / ({HumanCreatinineUrineRecord001} / 1000)"

