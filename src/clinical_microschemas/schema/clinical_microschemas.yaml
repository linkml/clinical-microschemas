#────────────────────────────────────────────────────────────────
# SLOTS
#────────────────────────────────────────────────────────────────

slots:
  dose:
    range: Quantity
    description: Amount of drug per administration
  frequency:
    range: Quantity
    description: How often e.g. 2 per day
  indication:
    range: uriorcurie
    description: Condition/reason for drug (SNOMED, ICD, Mondo, HPO, etc)
  subject_identifier:
    range: uriorcurie
    description: An identifier for the subject of the datum
  measurement_type:
    range: uriorcurie
    slot_uri: bdchm:observation_type
    description: A CURIE from OBA, OMOP, or LOINC
  unit:
    range: uriorcurie
    slot_uri: bdchm:unit
    description: A unit from UCUM
  method:
    range: MethodEnum
    slot_uri: bdchm:method_type
    description: The method used for the measurement
  instrument:
    range: InstrumentEnum
    description: The instrument used for the measurement
  reagent_kit:
    range: ReagentKitEnum
    description: The reagent kit used for the measurement
  calculated_from:
    description: An expression pointing at other CDE classes
  body_location:
    range: uriorcurie
    slot_uri: bdchm:BodySite
    description: A CURIE from UBERON
  body_position:
    range: BodyPositionEnum
    description: The body position during measurement
  context:
    range: ContextEnum
    description: The context of the measurement
  collected_by:
    range: CollectedByEnum
    description: Who collected the measurement
  condition_type:
    range: uriorcurie
    slot_uri: bdchm:condition_concept
    description: A CURIE from MONDO or HPO
  associated_evidence:
    range: AssociatedEvidenceEnum
    description: The method used for diagnosis
  drug_type:
    range: uriorcurie
    slot_uri: bdchm:drug_concept
    description: A CURIE from RxNorm
  procedure_type:
    range: uriorcurie
    slot_uri: bdchm:procedure_concept
    description: A CURIE from OMOP
  data_type:
    range: DataTypeEnum
    description: The data type of the observation
  age_at_measurement:
    range: Quantity
    description: Age of the subject at the time of measurement
  age_at_condition_start:
    range: Quantity
    description: Age of the subject at the start of the condition
  age_at_condition_end:
    range: Quantity
    description: Age of the subject at the end of the condition
  condition_status:
    range: HistoricalStatusEnum
    description: >-
      A value indicating whether the medical condition described in this record
      is present, absent, historically present, or unknown for this individual patient.
  condition_provenance:
    range: ProvenanceEnum
    description: A value representing the provenance of the Condition record.
  condition_severity:
    range: ConditionSeverityEnum
    description: A subjective assessment of the severity of the condition.
  relationship_to_participant:
    range: FamilyRelationshipEnum
    description: >-
      A value indicating the relationship between the Participant to which the Condition
      is attributed and the individual who had the reported Condition. If the Condition
      is affecting the participant themselves, then 'Self' is the appropriate relationship.
  age_at_drug_start:
    range: Quantity
    description: Age of the subject at the start of drug exposure
  age_at_drug_end:
    range: Quantity
    description: Age of the subject at the end of drug exposure
  age_at_procedure_start:
    range: Quantity
    description: Age of the subject at the start of the procedure
  age_at_procedure_end:
    range: Quantity
    description: Age of the subject at the end of the procedure
  route_of_administration:
    range: RouteAdminEnum
    description: Routes of drug administration
  measurement_value:
    range: Quantity
    description: The "value" in the observation key/value pair
  predicted_value:
    range: decimal
    description: >-
      A predicted measurement value based on a reference population, range, equation,
      or other relevant information. Often used to normalize a measurement based on body
      size, age, or sex
  lower_limit_normal:
    range: decimal
    description: >-
      placeholder
  upper_limit_normal:
    range: decimal
    description: >-
      placeholder
  percent_predicted_value:
    range: decimal
    description: >-
      Ratio of the actual measured value to the predicted value
  activity_type:
    range: ActivityTypeEnum
    description: >-
      Activity that adds context to a clinical measurement
  relative_timing:
    range: RelativeTimingEnum
    description: >-
      Timing of the activity relative to the clinical measurement
  study_site:
    range: string
    description: >-
      Institution name, clinic name, or other indication of where a measurement
      was taken geographically
  absolute_time:
    range: datetime
    description: >-
      Calendar date when a measurement was taken
  age_at_condition_record:
    range: Quantity
    description: >-
      Age of participant when record of the condition was collected. This 
      slot can accommodate an "age at encounter" where a medical history was 
      collected, or a record was adjudicated.
  age_at_drug_record:
    range: Quantity
    description: >-
      Age of participant when record of the drug was collected. This 
      slot can accommodate an "age at encounter" where the participant was
      asked for their medication list. 
  age_at_procedure_record:
    range: Quantity
    description: >-
      Age of participant when record of the procedure was collected. This 
      slot can accommodate an "age at encounter" where the participant was
      asked for their medical history.

#────────────────────────────────────────────────────────────────
# ENUMS
#────────────────────────────────────────────────────────────────

enums:
  HistoricalStatusEnum:
    description: >-
      Indicates whether something is present, absent, historical, or its status is unknown.
    permissible_values:
      present:
        description: Was present in the patient at observation time.
      absent:
        description: Was absent in the patient at observation time.
      unknown:
        description: Was of unknown status in the patient at observation time.
      historical:
        description: Was present in the patient historically.

  ProvenanceEnum:
    description: A set of values indicating the source or origin of a clinical record.
    permissible_values:
      ehr_billing_diagnosis:
        description: Diagnosis from EHR billing.
      ehr_chief_complaint:
        description: Chief complaint from EHR.
      ehr_encounter_diagnosis:
        description: Encounter diagnosis from EHR.
      ehr_episode_entry:
        description: Episode entry from EHR.
      ehr_problem_list_entry:
        description: Problem list entry from EHR.
      first_position_condition:
        description: First position condition.
      primary_condition:
        description: Primary condition.
      secondary_condition:
        description: Secondary condition.
      nlp_derived:
        description: Derived from natural language processing.
      observation_recorded_from_ehr:
        description: Observation recorded from EHR.
      patient_self_reported_condition:
        description: Patient self-reported condition.
      referral_record:
        description: From referral record.
      tumor_registry:
        description: From tumor registry.
      working_diagnosis:
        description: Working diagnosis.
      clinical_diagnosis:
        description: Clinical diagnosis.

  ConditionSeverityEnum:
    description: A subjective assessment of the severity of a condition.
    permissible_values:
      mild:
        description: Lower intensity condition.
        meaning: OMOP:4116992
      moderate:
        description: Medium intensity condition.
        meaning: OMOP:3272197
      severe:
        description: Higher intensity condition.
        meaning: OMOP:4087703

  FamilyRelationshipEnum:
    description: Values describing kinship connections between individuals.
    permissible_values:
      oneself:
