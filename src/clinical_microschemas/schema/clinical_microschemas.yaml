#Need some suggestions on how to bundle a measured, predicted, and percent predicted
#value. I suspect what I have done is not great. Open to suggestions.  
#SPIROMETRY
#-------------------------------------------------------------
  
  HumanFvcRecord:
    is_a: ClinicalMeasurementRecord
    mixins:
      - Relativity
      - Context
    description: >-
      Total amount of air a person can forcibly exhale after taking the deepest breath
      possible. This microschema uses the Relativity mixin to bundle measured, predicted,
      and percent predicted values.
    rules:
      - preconditions:
          slot_conditions:
            measurement_type:
              any_of:
                - equals_string: OMOP:4176265
        postconditions:
          slot_conditions:
            unit:
              any_of:
                - equals_string: L
                - equals_string: mL
            instrument:
              any_of:
                - equals_string: spirometer
                - equals_string: vitalograph
                - equals_string: body_plesmograph
            data_type:
              equals_string: decimal
            method:
              any_of:
                - equals_string: spirometry
                - equals_string: body_plesmography
    slot_usage:
      measurement_value:
        range: HumanFvcQuantity
      predicted_value:
        required: true
      percent_predicted_value:
        required: true

  HumanMeasuredFvcRecord:
    is_a: ClinicalMeasurementRecord
    description: >-
      Total amount of air a person can forcibly exhale after taking the deepest breath
      possible
    slot_usage:
      measurement_value:
        range: HumanMeasuredFvcQuantity
    rules:
      - preconditions:
          slot_conditions:
            measurement_type:
              any_of:
