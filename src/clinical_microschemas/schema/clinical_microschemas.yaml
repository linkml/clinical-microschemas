#------------------------------------------------------------------
#    Mixins
#-----------------------------------------------------------------
  Relativity:
    mixin: true
    description: >-
      Mixin providing slots for bundling measured, predicted, and percent predicted values
      with their normal limits.
    slots:
      - predicted_value
      - lower_limit_normal
      - upper_limit_normal
      - percent_predicted_value

  Context:
    mixin: true
    description: >-
      Mixin providing contextual slots that describe the activity type and relative timing
      associated with a clinical measurement.
    slots:
      - activity_type
      - relative_timing

  #────────────────────────────────────────────────────────────────
  # Typed Quantity subclasses for per-record numeric bounds
  #────────────────────────────────────────────────────────────────
  # measurement_value is a Quantity (an object with quantity_value and
  # quantity_unit). Numeric bounds therefore must attach to quantity_value,
  # not to the Quantity wrapper. Each record's measurement_value range is
  # set to one of these typed Quantities via slot_usage.
  
  #------------------------------
  #Height
  #------------------------------

  HumanBodyHeightQuantity:
    is_a: Quantity
    description: Human body height. Negative heights are impossible.
    slot_usage:
      quantity_value:
        minimum_value: 0

  HumanBodyHeightQuantity001:
    is_a: HumanBodyHeightQuantity
    description: >-
      Standing wall-mounted or portable stadiometer human body height in cm, bounded 30–230. 
      Minimum represents observed limits on human height. Maximum represents
      limit of a wall-mounted stadiometer.
    slot_usage:
      quantity_value:
        minimum_value: 30
        maximum_value: 230

  HumanBodyHeightQuantity002:
    is_a: HumanBodyHeightQuantity
    description: >-
      Standing wall-mounted or portable stadiometer human body height in inches, bounded 20–90. 
      Minimum represents observed limits on human height. Maximum represents
      limit of a wall-mounted and a portable stadiometer.
    slot_usage:
      quantity_value:
        minimum_value: 20
        maximum_value: 90

  HumanBodyHeightQuantity003:
    is_a: HumanBodyHeightQuantity
    description: >-
      Standing anthropometer human body height in cm, bounded 30-250. 
      Minimum represents observed limits on human height. Maximum represents
      limit of anthropometer rod.
    slot_usage:
      quantity_value:
        minimum_value: 30
        maximum_value: 250

  HumanBodyHeightQuantity004:
    is_a: HumanBodyHeightQuantity
    description: >-
      Standing wall-mounted or portable stadiometer human body height in ft, bounded 0.98-8.2. 
      Minimum represents observed limits on human height. Maximum represents
      limit of a wall-mounted stadiometer.
    slot_usage:
      quantity_value:
        minimum_value: 0.98
        maximum_value: 8.2
  
  HumanBodyHeightQuantity005:
    is_a: HumanBodyHeightQuantity
    description: >-
      Minimum and maximum represent biologically plausible values for adults. Use this
      Quantity when instrument is unknown or the method is a survey or interview. Unit
      is cm.
    slot_usage:
      quantity_value:
        minimum_value: 54
        maximum_value: 273

