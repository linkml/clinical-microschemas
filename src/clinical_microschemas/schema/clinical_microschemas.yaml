      percutaneous:
        description: Percutaneous administration
        meaning: OMOP:4177987

  DataTypeEnum:
    description: The data type of an observation value
    permissible_values:
      decimal:
        description: Decimal number
      integer:
        description: Integer number
      enum:
        description: Enumerated value
      boolean:
        description: Boolean value
      string:
        description: String value
      numeric:
        description: decimal or integer - from dbGAP data types
      code:
        description: >-
          data are a list of acceptable values or a controlled vocabulary,
          from dbGAP data types, same as enum
      uriorcurie:
        description: A URI or CURIE value
      identifier:
        description: a string used as an identifier by an external data source

  MethodEnum:
    description: The method used for a measurement or observation
    permissible_values:
      anthropometry:
        description: >-
          physical measurement of the human body, including height, weight, and other
          body dimensions
      survey:
        description: >-
          list of questions given to a participant for data collection purposes - the
          survey is filled out by the participant independently
      interview:
        description: >-
          series of questions posed to a participant by an interviewer for data
          collection purposes
      calculated:
        description: >-
          clinical record that results from a calculation rather than being directly
          measured
      spirometry:
        description: >-
          breathing test used to assess lung function
      body_plesmography:
        description: >-
          precise pulmonary function test where the patient sits in a sealed chamber and
          breathes into a specialized mouthpiece. This method uses Boyle's Law  and is
          considered a "gold standard"
      gli:
        description: >-
          a standard reference range and calculator for spirometry and lung function
          tests published by the Global Lung Function Initiative in 2012
      gli_global:
        description: >-
          a standard reference range and calculator for spirometry and lung function
          tests published by the Global Lung Function Initiative in 2022. This is an
          update of the 2012 standard that is more ethnically diverse
      nhanesiii:
        description: >-
          standard reference equations for spirometry published in 2005
      jaffe_reaction:
        description: >-
          colorimetric method for measuring creatinine based on the Jaffe reaction,
          in which creatinine reacts with picric acid in alkaline solution
      cbc:
        description: >-
          complete blood count; a common blood test that measures the cellular
          components of blood including red cells, white cells, and platelets
      plac_test:
        description: >-
          Lipoprotein-Associated Phospholipase A2 (Lp-PLA2) test; a blood test
          used to assess cardiovascular and stroke risk
      enzymatic_creatinine_assay:
        description: >-
          enzymatic method for measuring creatinine using creatininase, offering
          greater specificity than the Jaffe reaction with fewer interferences
      lc_ms_ms:
        description: >-
          liquid chromatography-tandem mass spectrometry; a reference method for
          quantifying analytes with high specificity and sensitivity
      immunoturbidometry:
        description: >-
          photometric method measuring the turbidity caused by antigen-antibody
          complexes in suspension
      immunonephelometry:
        description: >-
          optical method measuring light scatter from antigen-antibody complexes
          to quantify proteins such as albumin
      chemiluminescence_immunoassay:
        description: >-
          immunoassay that uses a chemiluminescent label to detect and quantify
          an analyte via light emission
      elisa:
        description: >-
          enzyme-linked immunosorbent assay; a plate-based immunoassay for
          detecting and quantifying proteins or antibodies
      albumin_dipstick:
        description: >-
          semi-quantitative colorimetric urine test strip method for detecting
          albumin
      hplc:
        description: >-
          high-performance liquid chromatography; a chromatographic technique
          used to separate, identify, and quantify analytes in a mixture

  InstrumentEnum:
    description: The instrument used for a measurement
    permissible_values:
      wall_mounted_stadiometer:
        description: >-
          fixed, high-precision medical device used to measure human height, consisting
          of a vertical measuring rod or tape fastened to a wall with a sliding headpiece
        meaning: MMO:0000105
      flexible_measuring_tape:
        description: >-
          flexible tape used to measure height or body circumference
      portable_stadiometer:
        description: >-
          portable device used to measure height, typically used in field settings
      anthropometer_rod:
        description: >-
          rigid rod-based instrument used to measure body dimensions including height
      sonar_stadiometer:
        description: >-
          ultrasound-based device used to measure height without contact
      mechanical_beam_balance_scale:
        description: >-
          medical device used to measure human weight
        meaning: MMO:0000087
      digital_scale:
        description: >-
          electronic device used to measure human weight using strain gauge sensors
        meaning: MMO:0000087
      spring_scale:
        description: >-
          mechanical device that measures weight by the displacement of a spring
      spirometer:
        description: >-
          medical device that measures lung function by recording the amount and speed
          of air a person can inhale and exhale
      vitalograph:
        description: >-
          a portable medical device that measures lung function by recording the amount
          and speed of air a person can inhale and exhale
      body_plesmograph:
        description: >-
          sealed, clear chamber with a mouthpiece for a person to breath through
      peak_flow_meter:
        description: >-
          portable, handheld device used to measure how fast and hard a person can
          exhale
      flow_cytometer:
        description: >-
          instrument that measures physical and chemical characteristics of cells
          or particles as they flow through a laser beam
      microscope:
        description: >-
          optical instrument used to magnify and visualize cells, microorganisms,
          or other small structures
      particle_counter:
        description: >-
          instrument that counts and sizes particles suspended in a fluid, used
          in hematology analyzers
      mechanical_baby_scale:
        description: >-
          mechanical scale designed to weigh infants and young children
      unknown:
        description: >-
          the instrument used for the measurement is not known or was not
          recorded

  ReagentKitEnum:
    description: The reagent kit used for a measurement
    permissible_values:
      placeholder:
        description: Placeholder value

  BodyPositionEnum:
    description: The body position during a measurement
    permissible_values:
      supine:
        description: Lying face up
      standing:
        description: Standing upright
      sitting:
        description: Seated position

  ContextEnum:
    description: The context in which a measurement was taken
    permissible_values:
      fasted_8_hrs:
        description: Fasted for 8 hours
      fasted_12_hrs:
        description: Fasted for 12 hours
      before_bronchodilator:
        description: Before bronchodilator administration
      after_bronchodilator:
        description: After bronchodilator administration
      taking_lipid_lowering_medications:
        description: While taking lipid-lowering medications
      before_physical_activity:
        description: Before physical activity
      during_physical_activity:
        description: During physical activity
      after_physical_activity:
        description: After physical activity
      during_procedure:
        description: During a procedure
      taking_diabetes_medication:
        description: While taking diabetes medication
      lowest:
        description: Lowest recorded value

  CollectedByEnum:
    description: Who collected the measurement
    permissible_values:
      doctor:
        description: Collected by a doctor
      nurse:
        description: Collected by a nurse
      technician:
        description: Collected by a technician
      self_administered:
        description: Self-administered by the patient
      first_examiner:
        description: Collected by the first examiner
      second_examiner:
        description: Collected by the second examiner

  AssociatedEvidenceEnum:
    description: The method used for diagnosis
    permissible_values:
      placeholder:
        description: Placeholder value

  ActivityTypeEnum:
    description: Type of activity being recorded
    permissible_values:
      fasting:
      bronchodilator_medication_use:
      diabetes_medication_use:
      antihyperlipidemics_medication_use:
      physical_activity:
      medical_procedure:

  RelativeTimingEnum:
    description: Set of values describing the relative timing of an activity
    permissible_values:
      after:
      before:
      during:

